<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TableSide Growth — Private</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#eef2ff}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:28px}.card{background:#121a2e;border:1px solid #26324d;border-radius:16px;padding:20px;margin:16px 0}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.muted{color:#9eabc5}.ok{color:#77e0a0}.err{color:#ff9090}input,textarea,select,button{font:inherit;border-radius:9px;border:1px solid #354361;padding:10px;background:#0d1528;color:#eef2ff}button{cursor:pointer;background:#405cf5;border-color:#405cf5;font-weight:700}button.secondary{background:#18233b;border-color:#354361}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}textarea{grid-column:1/-1;min-height:80px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #26324d;vertical-align:top}.actions{display:flex;gap:6px;flex-wrap:wrap}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}table{font-size:13px}.shell{padding:14px}}
</style>
</head><body><main class="shell">
<div class="top"><div><h1>TableSide Growth</h1><div class="muted">PRIVATE OWNER DASHBOARD — AI prepares; you authorize external actions.</div></div><button id="logout" class="secondary hidden">Log out</button></div>
<section id="login" class="card"><h2>Owner Login</h2><form id="loginForm" class="grid"><input id="email" type="email" placeholder="Owner email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><p id="loginStatus" class="muted"></p></section>
<section id="app" class="hidden">
<div class="card"><div class="top"><div><h2>Prospect Pipeline</h2><div id="sessionInfo" class="muted"></div></div><button id="refresh" class="secondary">Refresh</button></div></div>
<div class="card"><h3>Add Prospect</h3><form id="prospectForm" class="grid"><input id="businessName" placeholder="Business name" required><input id="city" placeholder="City"><input id="publicEmail" type="email" placeholder="Public business email"><input id="website" placeholder="Website"><input id="instagram" placeholder="Instagram"><select id="status"><option value="new">New</option><option value="researching">Researching</option><option value="draft_ready">Draft ready</option><option value="contacted">Contacted</option><option value="replied">Replied</option><option value="interested">Interested</option><option value="client">Client</option></select><input id="nextAction" placeholder="Next action"><input id="nextActionAt" type="datetime-local"><textarea id="notes" placeholder="Internal notes"></textarea><button>Add to private database</button></form><p id="saveStatus" class="muted"></p></div>
<div class="card"><table><thead><tr><th>Business</th><th>Status</th><th>Contact</th><th>Next Action</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" class="muted">No prospects yet.</p></div>
</section></main><script src="app.js?v=private-1"></script></body></html>
